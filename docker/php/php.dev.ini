; Development PHP settings. Loaded as conf.d/zz-app.ini so it wins over the
; image defaults — the same slot docker/php/php.ini takes in the prod stage,
; but deliberately NOT the same file.
;
; Two settings in the production php.ini must never reach a development
; container. opcache.validate_timestamps = 0 stops PHP stating a source file
; after first load, which is correct for an immutable image and wrong here,
; where the project is bind-mounted and every edit would be ignored until the
; container restarted. display_errors = Off hides exactly what APP_DEBUG is
; turned on for.
;
; ---------------------------------------------------------------------------
; Uploads
; ---------------------------------------------------------------------------
; These, development needs for the same reason production does, and without
; them the capture screen and /scan cannot take a real photograph at all.
;
; The php:8.4-cli image defaults to upload_max_filesize = 2M, while the
; application allows config('catalog.capture.max_photo_kilobytes') = 12288 KB
; per photo and /scan accepts config('catalog.scan.max_photos') = 6 of them.
; A phone photograph clears 2M easily — both committed fixtures under
; tests/Fixtures/packaging/ are 2.5–2.9 MB.
;
; When PHP is the one to reject a file it does so before any userland code
; runs: $_FILES comes back empty and Laravel reports a missing field. The
; upload fails as "The photos field is required", which names neither the file
; nor its size and reads like a broken form. So PHP's limits are set ABOVE the
; application's on purpose, here as in production, and the `max:12288` rule in
; the form request is what rejects an oversized photo — with a message naming
; the photo.
;
; These three move together with client_max_body_size in docker/nginx/nginx.conf
; and CAPTURE_MAX_PHOTO_KB in .env, or not at all.
upload_max_filesize = 16M
post_max_size = 110M
max_file_uploads = 10

; A packaged /scan of a dozen cards is seconds of OpenCV and Tesseract work in
; the recognizer, and the request waits on it.
memory_limit = 256M
max_execution_time = 300
