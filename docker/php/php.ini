; Production PHP settings. Loaded as conf.d/zz-app.ini so it wins over the
; image defaults.

; ---------------------------------------------------------------------------
; Uploads
; ---------------------------------------------------------------------------
; The capture screen accepts two card photos plus up to six loose ones, each
; capped by the application at config('catalog.capture.max_photo_kilobytes'),
; which is 12288 KB.
;
; upload_max_filesize is set ABOVE that app limit on purpose. When PHP is the
; one to reject a file it does so before any userland code runs: $_FILES comes
; back empty or truncated and Laravel reports a missing field, which reads like
; a broken form. Letting the request through means the `max:12288` rule in
; StoreSubmissionRequest rejects it and the admin gets a real message naming the
; photo that was too big.
upload_max_filesize = 16M
post_max_size = 110M
max_file_uploads = 10

memory_limit = 256M
max_execution_time = 300

; ---------------------------------------------------------------------------
; opcache
; ---------------------------------------------------------------------------
; validate_timestamps=0 means PHP never stats a source file after first load.
; That is correct here because the source is baked into the image and cannot
; change while the container runs — but it also means a code change requires a
; rebuild and restart, never an edit in place. See docs/deploy.md.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; ---------------------------------------------------------------------------
; Hygiene
; ---------------------------------------------------------------------------
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
date.timezone = UTC
