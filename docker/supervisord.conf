; nginx and php-fpm in one container. They are a single unit here — nginx does
; nothing useful without fpm and vice versa — so splitting them into two
; containers would only buy a shared volume for public/ and a second thing to
; keep in sync.
;
; The queue worker and the scheduler are normally NOT here: under docker
; compose each runs as its own container from the same image, so it can be
; restarted and watched independently of web traffic — a stuck job must not
; take the review screen down with it.
;
; On Railway (README §8.6) they run here instead, switched on by
; RUN_QUEUE_WORKER / RUN_SCHEDULER (the entrypoint defaults both to false).
; Two reasons: Railway services don't share a disk, and the scheduler's hourly
; catalog:prune-scans must delete unshared scan photos from the disk they are
; on — this one; and one service costs less than three. Both run as www-data,
; like php-fpm, so nothing they write is unreadable to it.

[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

[program:php-fpm]
command = php-fpm --nodaemonize --force-stderr
autostart = true
autorestart = true
startretries = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
; php-fpm holds in-flight requests; give it a moment to finish them on deploy.
stopwaitsecs = 30

[program:nginx]
command = nginx
autostart = true
autorestart = true
startretries = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
; nginx treats QUIT as "drain then exit"; TERM would cut active uploads, and a
; capture is a ~100 MB POST from a phone on mobile data.
stopsignal = QUIT
stopwaitsecs = 30

; Same flags as the entrypoint's `worker` role; see the comments there on
; --timeout and the queue's retry_after.
[program:queue-worker]
command = php artisan queue:work --tries=3 --timeout=300 --max-time=3600 --sleep=3
directory = /var/www/html
user = www-data
autostart = %(ENV_RUN_QUEUE_WORKER)s
autorestart = true
startretries = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
; Let a running job finish (its --timeout is 300s) rather than cut it off.
stopsignal = TERM
stopwaitsecs = 310

[program:scheduler]
command = php artisan schedule:work
directory = /var/www/html
user = www-data
autostart = %(ENV_RUN_SCHEDULER)s
autorestart = true
startretries = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
