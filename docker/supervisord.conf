; nginx and php-fpm in one container. They are a single unit here — nginx does
; nothing useful without fpm and vice versa — so splitting them into two
; containers would only buy a shared volume for public/ and a second thing to
; keep in sync.
;
; The queue worker is NOT here. It runs as its own container from the same
; image so it can be scaled, restarted and watched independently of web
; traffic, which matters because a stuck vision call must not take the review
; screen down with it.

[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

[program:php-fpm]
command = php-fpm --nodaemonize --force-stderr
autostart = true
autorestart = true
startretries = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
; php-fpm holds in-flight requests; give it a moment to finish them on deploy.
stopwaitsecs = 30

[program:nginx]
command = nginx
autostart = true
autorestart = true
startretries = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
; nginx treats QUIT as "drain then exit"; TERM would cut active uploads, and a
; capture is a ~100 MB POST from a phone on mobile data.
stopsignal = QUIT
stopwaitsecs = 30
