# Production web server for the Laravel app. Serves public/ directly and hands
# everything else to php-fpm over loopback, both processes supervised inside the
# one `web` container.

user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

# supervisord owns the process lifecycle, so nginx must not background itself.
daemon off;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging the real visitor rather than the Cloudflare edge, which is what
    # cloudflare-ips.conf's real_ip_header buys us.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # A capture posts up to two card photos plus six loose ones, each capped at
    # config('catalog.capture.max_photo_kilobytes') = 12288 KB. Sized above the
    # 96 MB worst case so nginx is never the thing that rejects an upload —
    # a 413 here is an opaque failure, whereas letting the request reach Laravel
    # produces a real validation message on the capture form.
    client_max_body_size 110M;
    client_body_timeout 300s;
    client_body_buffer_size 1M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    include /etc/nginx/cloudflare-ips.conf;
    include /etc/nginx/cloudflare-allow.conf;

    # How requests reach this nginx: straight from Cloudflare's edge (the
    # default, origin-mode.conf as built), or through a Cloudflare Tunnel
    # (docker-compose.tunnel.yml mounts origin-mode-tunnel.conf over it).
    # Defines $origin_https, which app.conf hands to PHP as HTTPS.
    include /etc/nginx/origin-mode.conf;

    # Both listeners serve the application identically. There is deliberately no
    # http->https redirect here: TLS is the edge's job, and an origin-side
    # redirect is what turns a Cloudflare "Flexible" SSL setting into an
    # infinite loop (client https -> edge http -> origin 301 -> https -> ...).
    # Full (strict) means Cloudflare only ever connects on 443 anyway, and the
    # allow list below is what keeps port 80 from being a second front door.

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        if ($from_cloudflare = 0) {
            return 403;
        }

        include /etc/nginx/app.conf;
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name _;

        # Written by docker/entrypoint.sh, because which certificate to use is
        # only knowable at boot: it points at the mounted Cloudflare Origin CA
        # pair when one exists, and at a generated self-signed pair otherwise so
        # the container still comes up for local testing. Cloudflare Full
        # (strict) rejects the self-signed one with a 526 — a different and far
        # more diagnosable error than the 525 this deployment exists to fix.
        #
        # ssl_certificate takes no conditional form, and ./certs is mounted
        # read-only, so this indirection is what lets both be true at once.
        include /etc/nginx/ssl.conf;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        if ($from_cloudflare = 0) {
            return 403;
        }

        include /etc/nginx/app.conf;
    }
}
