# Origin mode: direct. Cloudflare's edge connects to this box on 443 (Full
# strict) with the origin certificate, so whether the request was HTTPS is
# nginx's own answer.
#
# The other modes are origin-mode-tunnel.conf, mounted over this file by
# docker-compose.tunnel.yml, and origin-mode-railway.conf, written over it by
# the entrypoint. All three must define $origin_https and $origin_allowed.
map $https $origin_https {
    default $https;
}

# Who may connect: Cloudflare's edge (cloudflare-allow.conf).
map $from_cloudflare $origin_allowed {
    1       1;
    default 0;
}
