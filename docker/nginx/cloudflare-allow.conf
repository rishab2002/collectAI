# Which peers may connect at all: Cloudflare's edge, plus loopback and the
# Docker networks. The same ranges as cloudflare-ips.conf; nginx has no
# directive that does both jobs, so docker/nginx/refresh-cloudflare-ips.sh
# regenerates both files together — edit neither by hand.
#
# Purpose: without this the origin address is a second, unprotected front door.
# Anyone who resolves it (it is not secret — certificate transparency logs and
# old DNS records leak it routinely) could skip the edge and with it
# Cloudflare's TLS policy, rate limiting and WAF.
#
# **A `geo` on $realip_remote_addr, never `allow`/`deny`.** cloudflare-ips.conf
# rewrites the client address to the visitor (CF-Connecting-IP) before the
# access phase runs, so `allow <Cloudflare range>` is checked against the
# *visitor's* address and refuses every real visitor. Measured 2026-11-03 with
# nginx 1.24: a request from a trusted edge carrying CF-Connecting-IP was
# refused "by rule" as the visitor's IP. $realip_remote_addr is the address of
# the peer that actually connected, before the rewrite — the one to check.
#
# Included at http level; each server answers 403 when this is 0.

geo $realip_remote_addr $from_cloudflare {
    default 0;

    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;

    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;

    # Loopback and the Docker networks. The container healthcheck fetches /up
    # over loopback, and a Cloudflare Tunnel's cloudflared reaches nginx over
    # the compose network. Unroutable from the internet.
    127.0.0.1 1;
    ::1 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
}
