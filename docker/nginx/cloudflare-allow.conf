# The same ranges as cloudflare-ips.conf, as `allow` rules rather than
# `set_real_ip_from`. nginx has no directive that does both, so the list is
# duplicated and docker/nginx/refresh-cloudflare-ips.sh regenerates both files
# together — edit neither by hand.
#
# Purpose: without this the Lightsail address is a second, unprotected front
# door. Anyone who resolves the origin IP (it is not secret — certificate
# transparency logs and old DNS records leak it routinely) could skip the edge
# and with it Cloudflare's TLS policy, rate limiting and WAF.

allow 173.245.48.0/20;
allow 103.21.244.0/22;
allow 103.22.200.0/22;
allow 103.31.4.0/22;
allow 141.101.64.0/18;
allow 108.162.192.0/18;
allow 190.93.240.0/20;
allow 188.114.96.0/20;
allow 197.234.240.0/22;
allow 198.41.128.0/17;
allow 162.158.0.0/15;
allow 104.16.0.0/13;
allow 104.24.0.0/14;
allow 172.64.0.0/13;
allow 131.0.72.0/22;

allow 2400:cb00::/32;
allow 2606:4700::/32;
allow 2803:f800::/32;
allow 2405:b500::/32;
allow 2405:8100::/32;
allow 2a06:98c0::/29;
allow 2c0f:f248::/32;

# Loopback and the Docker bridge networks. The container healthcheck curls
# /up over loopback and would otherwise 403 itself into a permanent
# "unhealthy", and these ranges are unroutable from the internet anyway — the
# Lightsail firewall only exposes 22, 80 and 443.
allow 127.0.0.1;
allow ::1;
allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;

deny all;
