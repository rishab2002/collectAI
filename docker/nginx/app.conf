# The application itself. Included at server level by both listeners in
# nginx.conf, so the two differ only in TLS.

root /var/www/html/public;
index index.php;

charset utf-8;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Vite writes content-hashed filenames here, so the bytes behind a given URL can
# never change and the response is safe to pin. Anything shorter just costs
# repeat downloads on a phone.
location /build/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# The service worker must be revalidated every time, or a stale one keeps
# serving its old precache list and the app cannot be updated. This mirrors the
# rule the worker itself follows: resources/js registers it, and sw.js never
# caches HTML precisely so a stale review queue can't be shown.
location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
}

location = /manifest.json {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
}

location = /favicon.ico { access_log off; log_not_found off; try_files $uri =404; }
location = /robots.txt  { access_log off; log_not_found off; try_files $uri =404; }

location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_index index.php;
    include /etc/nginx/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    # $fastcgi_path_info, not $path_info — the latter is not a variable nginx
    # defines, and naming it is a hard config error ("unknown \"path_info\"
    # variable") that kills the worker at startup, not a silently empty value.
    fastcgi_param PATH_INFO $fastcgi_path_info;

    # Whether the visitor's connection was HTTPS, so Laravel builds https://
    # URLs and sets secure cookies. Behind Cloudflare's edge, TLS terminates
    # here with the origin certificate and this is nginx's own $https — no
    # client-supplied header trusted. Through a tunnel, origin-mode-tunnel.conf
    # sets it: Cloudflare serves visitors HTTPS and the tunnel is the only way
    # in. Empty means unset (if_not_empty), which is plain HTTP.
    fastcgi_param HTTPS $origin_https if_not_empty;

    fastcgi_read_timeout 300s;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
}

# Nothing else in public/ should ever be executed or served as a dotfile.
location ~ /\.(?!well-known).* {
    deny all;
}
