# Cloudflare's published edge ranges, fetched 2026-08-10 from
# https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6
#
# Two jobs, both load-bearing:
#
#   1. `set_real_ip_from` tells nginx these peers are trusted to state the real
#      client address, so REMOTE_ADDR becomes the visitor rather than the edge.
#      Without it every request reaching PHP carries a Cloudflare IP, and
#      LoginController::throttleKey() — which keys on email + $request->ip() —
#      loses the IP half of its key. Its own comment explains why that matters:
#      per-email alone "would let anyone lock the admin out of their own
#      catalog".
#
#   2. The same list gates port 443 in nginx.conf, so the Lightsail IP cannot be
#      hit directly. Otherwise anyone who learns the origin address bypasses
#      Cloudflare entirely and the WAF, caching and TLS policy go with it.
#
# Refresh with docker/nginx/refresh-cloudflare-ips.sh. Cloudflare changes these
# rarely, but a stale list fails in a confusing direction: new edge nodes get
# 403ed and only some visitors see it.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# CF-Connecting-IP is a single address Cloudflare sets itself and overwrites on
# every request, so unlike X-Forwarded-For it cannot be seeded by the client.
# That is why this is solved here and not with Laravel's TrustProxies: trusting
# proxies at '*' would have Laravel re-read the forgeable header and undo it.
real_ip_header CF-Connecting-IP;
