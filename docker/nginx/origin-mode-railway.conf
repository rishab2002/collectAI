# Origin mode: Railway. A template — the entrypoint copies it over
# /etc/nginx/origin-mode.conf when ORIGIN_MODE=railway, replacing
# __ORIGIN_SECRET__ with $ORIGIN_SECRET. Never used otherwise.
#
# The path is visitor → Cloudflare (Access, WAF) → Railway's edge → here.
# Railway's edge is shared by every Railway app and routes on the Host header,
# so anyone can reach this container through it with `Host: collectai.club`
# and skip Cloudflare entirely — Access login included. Railway publishes no
# address ranges to allow-list, so the Cloudflare IP allow-list the other modes
# use cannot work here (every request arrives from Railway's proxy).
#
# What proves a request came through Cloudflare instead: a secret header that
# a Cloudflare Transform Rule adds to every request for the zone (README §8.6).
# A client cannot forge it — the rule *sets* the header, overwriting whatever
# the client sent — and cannot learn it.

# The secret is a map key, and nginx's default bucket (64 bytes) is too small
# for the 64-character `openssl rand -hex 32` value — measured: "could not
# build map_hash". The entrypoint caps the secret at 100 characters.
map_hash_bucket_size 128;

map $http_x_origin_auth $origin_secret_ok {
    default                0;
    "__ORIGIN_SECRET__"    1;
}

# Railway's deploy healthcheck calls /up directly, without the header. /up is
# Laravel's bare "the app boots" page and says nothing about the catalog.
map $uri $origin_healthcheck {
    default 0;
    /up     1;
}

map "$origin_secret_ok$origin_healthcheck" $origin_allowed {
    "00"    0;
    default 1;
}

# The visitor's address. cloudflare-ips.conf trusts only Cloudflare's ranges
# to state CF-Connecting-IP, but here the peer is Railway's proxy, so trust any
# peer — safe *only* because a request without the secret is refused before it
# reaches PHP, and only Cloudflare adds the secret. Without this the login
# throttle (email + IP) would key every visitor on Railway's proxy address.
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;

# Railway terminates TLS and forwards plain HTTP to port 80; every visitor
# reached Cloudflare over HTTPS ("Always Use HTTPS"), so tell Laravel so.
map $https $origin_https {
    default on;
}
