# Origin mode: Cloudflare Tunnel. Mounted over /etc/nginx/origin-mode.conf by
# docker-compose.tunnel.yml; never used otherwise.
#
# In this mode nginx publishes no ports at all: the only thing that can reach
# it is cloudflared, on the compose network. Two consequences:
#
# 1. cloudflared is the peer that carries CF-Connecting-IP, so it must be
#    trusted to state the visitor's address — or every request reaches PHP as
#    the cloudflared container's IP and the login throttle (email + IP) loses
#    its IP half. Trusting the Docker ranges is safe only because nothing else
#    can connect; never use this file on a box that publishes 80/443.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;

# 2. The tunnel hands nginx plain HTTP on port 80, but every visitor reached
#    Cloudflare over HTTPS (turn on "Always Use HTTPS"), so tell Laravel so.
map $https $origin_https {
    default on;
}
