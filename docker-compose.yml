services:
  app:
    # `target` is not optional. The Dockerfile is multi-stage and `prod` is the
    # last stage, so omitting this would build the production image — nginx,
    # php-fpm, no dev dependencies — and quietly break the test suite here.
    build:
      context: .
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    # Deliberately no `env_file: .env`. The project directory is bind-mounted
    # above, so Laravel reads .env off the filesystem itself and the directive is
    # redundant — but not harmless. It injects every development value into the
    # container's process environment, where PHP exposes them via $_SERVER, and
    # Laravel's Dotenv reads $_SERVER ahead of everything else. That had two
    # consequences worth remembering:
    #
    #   - phpunit.xml's <env> entries were silently ignored even with
    #     force="true" (PHPUnit sets $_ENV and putenv, but not $_SERVER), so the
    #     test suite ran RefreshDatabase against the development database.
    #   - Editing .env did nothing until the container was recreated, because the
    #     process environment was captured at container start.
    #
    # Reading .env from disk fixes both.
    depends_on:
      - db
      - redis
      - meilisearch
      - recognizer

  # The local car recognizer (recognizer/). Reads the catalog index the app
  # writes to storage/app/recognition (catalog:export-recognition-index) and
  # reloads it when it changes. Published on 8090 so you can also call it from
  # your own machine; the app reaches it as http://recognizer:8080.
  recognizer:
    build: ./recognizer
    ports:
      - "8090:8080"
    volumes:
      - ./storage/app/recognition:/data:ro

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diecast
      POSTGRES_USER: diecast
      POSTGRES_PASSWORD: diecast
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first creation of the pgdata volume.
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: diecast_dev_key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

volumes:
  pgdata:
  meili_data:
